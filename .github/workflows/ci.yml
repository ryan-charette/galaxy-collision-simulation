name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - repo-review
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        run: python -m pip install -e ".[test]"

      - name: Compile Python sources
        run: python -m compileall -q scripts src/python

      - name: Run Python tests
        run: python -m pytest

  cpp-checks:
    name: C++ checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_MPI=OFF -DENABLE_CUDA=OFF

      - name: Build simulator and tests
        run: cmake --build build --target fmm_galaxy_tests fmm_galaxy_sim --parallel

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install coverage tools
        run: python -m pip install -e ".[test,coverage]"

      - name: Run Python coverage
        run: |
          mkdir -p coverage
          python -m pytest \
            -p no:cacheprovider \
            --cov=src/python \
            --cov-report=term-missing \
            --cov-report=xml:coverage/python.xml

      - name: Configure C++ coverage build
        run: >
          cmake -S . -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_MPI=OFF
          -DENABLE_CUDA=OFF
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build C++ coverage targets
        run: cmake --build build-coverage --target fmm_galaxy_tests --parallel

      - name: Run C++ coverage tests
        run: ctest --test-dir build-coverage --output-on-failure

      - name: Generate C++ coverage report
        run: >
          gcovr
          --root .
          --filter src/cpp
          --exclude src/cpp/tests
          --xml-pretty
          --output coverage/cpp.xml
          build-coverage

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v6.0.1
        with:
          disable_search: true
          files: coverage/python.xml
          flags: python
          name: python
          use_oidc: true

      - name: Upload C++ coverage to Codecov
        uses: codecov/codecov-action@v6.0.1
        with:
          disable_search: true
          files: coverage/cpp.xml
          flags: cpp
          name: cpp
          use_oidc: true
