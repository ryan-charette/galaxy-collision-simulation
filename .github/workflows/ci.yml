name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - repo-review
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        run: python -m pip install -e ".[test]"

      - name: Compile Python sources
        run: python -m compileall -q scripts src/python

      - name: Run Python tests
        run: python -m pytest

  cpp-checks:
    name: C++ checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_MPI=OFF -DENABLE_CUDA=OFF

      - name: Build simulator and tests
        run: cmake --build build --target fmm_galaxy_tests fmm_galaxy_sim --parallel

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure
