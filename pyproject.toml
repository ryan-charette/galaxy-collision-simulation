[project]
name = "fmm-galaxy-tools"
version = "0.1.0"
description = "Python analysis and animation tools for the distributed FMM galaxy simulator"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "gymnasium>=0.29",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
dev = [
    "nox>=2024.4.15",
    "pre-commit>=3.7",
]

[dependency-groups]
test = [
    "pytest>=8.0",
]
dev = [
    { include-group = "test" },
    "nox>=2024.4.15",
    "pre-commit>=3.7",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[tool.mypy]
python_version = "3.10"
files = ["scripts", "src/python"]
ignore_missing_imports = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

[tool.pytest.ini_options]
minversion = "6"
addopts = ["-ra", "--strict-config", "--strict-markers"]
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["src/python/tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["python*"]
