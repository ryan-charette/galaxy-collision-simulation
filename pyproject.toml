[project]
name = "fmm-galaxy-tools"
version = "0.1.0"
description = "Python analysis and animation tools for the distributed FMM galaxy simulator"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Ryan Charette" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "pillow>=10.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/ryan-charette/galaxy-collision-simulation"
Repository = "https://github.com/ryan-charette/galaxy-collision-simulation"
Issues = "https://github.com/ryan-charette/galaxy-collision-simulation/issues"
Documentation = "https://github.com/ryan-charette/galaxy-collision-simulation/tree/main/docs"

[project.scripts]
fmm-galaxy-benchmark = "scripts.run_benchmarks:main"
fmm-galaxy-crossover = "python.analysis.solver_crossover:main"
fmm-galaxy-force-error = "scripts.run_force_error_benchmarks:main"
fmm-galaxy-parquet = "python.utils.parquet_io:main"
fmm-galaxy-plot = "python.analysis.plot_snapshots:main"
fmm-galaxy-render = "python.animation.render_snapshots:main"
fmm-galaxy-render-gif = "python.animation.render_scientific_gif:main"
fmm-galaxy-render-readme-gif = "scripts.render_readme_snapshot_gif:main"
fmm-galaxy-sweep = "scripts.sweep:main"
fmm-galaxy-viewer = "python.animation.interactive_viewer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
coverage = [
    "coverage[toml]>=7.6",
    "gcovr>=8.3",
    "pytest-cov>=6.0",
]
docs = [
    "breathe>=4.36",
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx>=8.1",
]
dev = [
    "nox>=2024.4.15",
    "pre-commit>=3.7",
]

[dependency-groups]
test = [
    "pytest>=8.0",
]
coverage = [
    "coverage[toml]>=7.6",
    "gcovr>=8.3",
    "pytest-cov>=6.0",
]
docs = [
    "breathe>=4.36",
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx>=8.1",
]
dev = [
    { include-group = "test" },
    { include-group = "coverage" },
    { include-group = "docs" },
    "nox>=2024.4.15",
    "pre-commit>=3.7",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[tool.mypy]
python_version = "3.10"
files = ["scripts", "src/python"]
strict = true
ignore_missing_imports = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

[tool.pytest.ini_options]
minversion = "6"
addopts = ["-ra", "--strict-config", "--strict-markers"]
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["src/python/tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/python"]
omit = [
    "src/python/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["python*", "scripts*"]
